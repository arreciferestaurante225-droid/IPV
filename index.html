<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07535e"><title>IPV</title>
<style>:root{color-scheme:light}body{font:16px system-ui,-apple-system,sans-serif;margin:0;padding:24px;background:#f3f7f7;color:#183236}.c{max-width:420px;margin:8vh auto;background:#fff;border:1px solid #d6e1e2;border-radius:14px;padding:20px}button{padding:12px 14px;border-radius:9px;border:0;background:#07535e;color:#fff;font:inherit;width:100%;margin-top:10px}input{font-size:16px;max-width:100%}</style></head>
<body><div class="c"><b>IPV</b><p id="m">Cargando…</p></div>
<!-- IPV-SHELL: este archivo no cambia. La app se actualiza desde la pestaña "Actualizar app". Para reinstalar abre la página con #instalar al final del enlace. -->
<script>
const CFG={apiKey:"AIzaSyDWyFpx8yHjjAvR_tD-Kgaxz_6nh7C8qt8",projectId:"arrecife-ipv"};
const U="https://firestore.googleapis.com/v1/projects/"+CFG.projectId+"/databases/(default)/documents/locs/_app?key="+CFG.apiKey;
const $=id=>document.getElementById(id);
function run(code,ver){window.__IPV_VER=ver;document.open();document.write(code);document.close()}
async function cloud(){const r=await fetch(U);if(r.status===404)return null;if(!r.ok)throw new Error(r.status);
 const f=(await r.json()).fields||{};return{code:f.code&&f.code.stringValue,ver:Number(f.ver&&f.ver.integerValue||0)}}
function install(m){document.body.innerHTML='<div class="c"><b>Instalar IPV</b><p>'+(m||"Elige el archivo app.html.")+'</p><input type="file" id="f" accept=".html,text/html"><button id="b">Instalar</button><p id="s"></p></div>';
 $("b").onclick=async()=>{const f=$("f").files[0];if(!f){$("s").textContent="Elige el archivo.";return}
  const code=await f.text();if(!code.includes("FIREBASE_CONFIG")){$("s").textContent="Ese archivo no es app.html.";return}
  $("s").textContent="Subiendo…";const ver=Date.now();
  try{const r=await fetch(U,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{code:{stringValue:code},ver:{integerValue:String(ver)}}})});
   if(!r.ok)throw new Error(r.status);try{localStorage.setItem("ipv_app",JSON.stringify({code,ver}))}catch(e){}
   history.replaceState(null,"",location.pathname);location.reload()}catch(e){$("s").textContent="Error al subir: "+e.message}}}
(async()=>{
 if(location.hash==="#instalar")return install();
 let c=null;try{c=JSON.parse(localStorage.getItem("ipv_app"))}catch(e){}
 if(c&&c.code)return run(c.code,c.ver);
 try{const x=await cloud();if(x&&x.code){try{localStorage.setItem("ipv_app",JSON.stringify(x))}catch(e){}return run(x.code,x.ver)}install()}
 catch(e){$("m").textContent="No se pudo conectar. Revisa internet y recarga."}
})();
</script></body></html>
