<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07535e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><title>IPV Central</title>
<style>
:root{--t:#07535e;--bg:#f3f7f7;--ln:#d6e1e2;--ink:#183236}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:4px solid var(--t);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:1.2rem;margin:0;color:var(--t);flex:1}button,input,textarea{font:inherit}
button{border:1px solid #b9cbcd;border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer}button.p{background:var(--t);color:#fff;border-color:var(--t)}
.w{padding:12px;max-width:1500px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input{border:1px solid #b9cbcd;border-radius:9px;padding:9px}#q{flex:1;min-width:140px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border-radius:99px}.tabs button.on{background:var(--t);color:#fff}.tabs small{display:block;font-size:.7rem;opacity:.8}
.tw{overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:12px;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}th{position:sticky;top:0;background:var(--t);color:#fff;font-size:.78rem;text-align:left;padding:9px 7px;z-index:1}
td{border-bottom:1px solid #e7eeee;padding:4px 6px;white-space:nowrap}td.nm{font-weight:600;min-width:170px;white-space:normal}
td input{width:84px;padding:7px;border:1px solid #d1dfe0;border-radius:6px;text-align:right}td input[readonly]{background:#f0f4f4;border-color:#e3eaea}
tr.band td{background:#ffe600;font-weight:700;color:#222}.fin{font-weight:700;text-align:right}.neg{color:#b00020}
.al{display:inline-block;padding:5px 8px;border-radius:6px;font-size:.78rem;font-weight:700}.hi{background:#ffdede;color:#8d2525}.lo{background:#dceeff;color:#154b7b}.eq{background:#eef0f0;color:#526164}
.obs{margin-top:10px}.obs textarea{width:100%;min-height:90px;border:1px solid #b9cbcd;border-radius:9px;padding:9px}
#st{font-size:.88rem;color:#33595d;margin:6px 0}#st.err{color:#b00020;font-weight:700}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:22px;border-radius:14px;border:1px solid var(--ln)}#login input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #b9cbcd;border-radius:8px}
[hidden]{display:none!important}

input,textarea{font-size:16px}html{-webkit-text-size-adjust:100%}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
td.nm,th:first-child{position:sticky;left:0;background:#fff;z-index:1}th:first-child{background:var(--t);z-index:2}tr.band td{position:static}
.cal{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;max-width:460px;margin:0 auto 12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg i{font-style:normal;font-size:.75rem;color:#6a8083}
.cg button{padding:4px 0;min-height:46px;border-radius:8px}.cg button small{display:block;font-size:.62rem;min-height:.8em;color:var(--t)}
.cg .has{background:#e3f4e6;border-color:#8cc99b}.cg .td{border:2px solid var(--t)}.cg .sel{background:var(--t);color:#fff}.cg .sel small{color:#fff}.cg button:disabled{opacity:.35}
.lc{background:#fff;border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;padding:6px 12px 12px}.lc summary{cursor:pointer;padding:8px 0}.lc summary span{float:right;font-size:.8rem;color:#52696b}
.lc table{min-width:520px}.ok{color:#17612b}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:#10272bbb;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.mod{background:#fff;border-radius:14px;padding:20px;width:min(380px,100%)}.mod input{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #b9cbcd;border-radius:8px}.bt{display:flex;gap:8px}
.syn .ini,.syn .fin{opacity:.3}

<form id="login"><h1>IPV Central</h1><p>Escribe tu usuario y tu PIN.</p>

<label>PIN</label><input id="pw" type="password" autocomplete="current-password" required>
<button class="p" style="width:100%">Entrar</button><p id="le" style="color:#b00020"></p></form>
<div id="app" hidden>
<header><h1 id="ttl">IPV</h1><span id="who"></span><button id="out">Salir</button></header>
<div class="w"><div class="tabs" id="tabs" hidden></div>
<div id="sumv" hidden><div class="cal" id="cal"></div><div class="bar"><label><input type="checkbox" id="all"> Mostrar todos los productos</label><button id="rs">↻ Actualizar</button></div><div id="dayv"></div></div>
<div id="edv"><div class="bar"><input id="q" type="search" placeholder="Buscar producto…"><label id="dtl">Fecha <input id="dt" type="date"></label>
<button id="add" hidden>＋ Producto</button><button id="ref">↻</button><button class="p" id="save">💾 Guardar</button></div>
<div id="st"></div><div id="msg"></div>
<div class="tw"><table><tbody id="tb"></tbody></table></div>
<div class="obs"><b>Observación</b><textarea id="obs"></textarea></div></div>
<p style="font-size:.82rem;color:#52696b">FINAL = INICIO + ENTRADA − TRASLADO − MERMA − SALIDA − DEVOLUCIÓN. Cada local solo ve y edita lo suyo, únicamente del día de hoy.</p></div></div>

function render(){
 const q=$("q").value.trim().toLowerCase(),adm=role==="admin",F=cat.fields;let g="";
 let h="<tr><th>PRODUCTO</th>"+(cat.gl?"":"<th>UM</th>")+"<th>INICIO</th>"+F.map(k=>`<th>${L[k]}</th>`).join("")+"<th>FINAL</th>"+(cat.useMin?"<th>MÍN.</th><th>ALERTA</th>":"")+(adm?"<th></th>":"")+"</tr>";
 cat.items.forEach(it=>{if(q&&!it.n.toLowerCase().includes(q))return;
  if(cat.gl&&it.g!==g){g=it.g;h+=`<tr class="band"><td colspan="20">${esc(g)}</td></tr>`}
  const m=data.mov[it.id]||{};
  h+=`<tr data-id="${it.id}"><td class="nm">${esc(it.n)}</td>`+(cat.gl?"":`<td>${esc(it.g)}</td>`)+`<td class="ini">${inp("i",data.inicio[it.id],adm)}</td>`
   +F.map(k=>`<td>${inp(k,m[k],true)}</td>`).join("")+`<td class="fin"></td>`
   +(cat.useMin?`<td>${inp("min",it.m,adm)}</td><td><span class="al"></span></td>`:"")+(adm?`<td><button data-del="${it.id}">✕</button></td>`:"")+"</tr>"});
 $("tb").innerHTML=h;$("tb").querySelectorAll("tr[data-id]").forEach(paintRow)}
$("q").oninput=()=>cat&&render();
$("tb").addEventListener("input",e=>{const t=e.target,tr=t.closest("tr"),id=tr.dataset.id,k=t.dataset.k,v=t.value===""||isNaN(parseFloat(t.value))?"":parseFloat(t.value);
 if(k==="i"){data.inicio[id]=n(v);ed.i[id]=n(v)}else if(k==="min"){const x=n(v);cat.items.find(q=>q.id===id).m=x;ed.min[id]=x}else{(data.mov[id]=data.mov[id]||{})[k]=v;(ed.mov[id]=ed.mov[id]||{})[k]=v}
 paintRow(tr);st("Cambios sin guardar…")});
$("tb").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b||!confirm("¿Eliminar este producto del catálogo?"))return;
 cat.items=cat.items.filter(x=>x.id!==b.dataset.del);render();st("Producto quitado. Pulsa Guardar.")});
$("add").onclick=()=>{if(!cat)return;$("an").value="";$("ag").value="";$("agl").textContent=cat.gl?"Sección (ej. RONES)":"Unidad de medida (ej. KG)";
 $("gl").innerHTML=[...new Set(cat.items.map(x=>x.g))].map(g=>`<option value="${esc(g)}">`).join("");$("am").hidden=false;$("an").focus()};
$("ac").onclick=()=>$("am").hidden=true;
$("af").onsubmit=e=>{e.preventDefault();const nm=$("an").value.trim().toUpperCase(),g=$("ag").value.trim().toUpperCase();
 if(cat.items.some(x=>x.n===nm&&x.g===g)){alert("Ese producto ya existe.");return}
 const it={id:"n"+Date.now(),n:nm,g,m:0,i0:0};if(cat.gl){let k=-1;cat.items.forEach((x,i)=>{if(x.g===g)k=i});k<0?cat.items.push(it):cat.items.splice(k+1,0,it)}else cat.items.push(it);
 $("am").hidden=true;render();st("Producto agregado. Pulsa Guardar para aplicarlo al local.")};
$("save").onclick=async()=>{if(!cat)return;data.obs=$("obs").value;const ref=doc(db,"locs",loc,"days",day),upd=Date.now();
 st(navigator.onLine?"Guardando…":"Sin conexión: se enviará al reconectar…");
 try{if(role==="admin"){await setDoc(doc(db,"locs",loc),cat);CAT[loc]=cat;CATC[loc]=JSON.parse(JSON.stringify(cat));await setDoc(ref,{inicio:data.inicio,mov:data.mov,obs:data.obs,upd})}
  else await updateDoc(ref,{mov:data.mov,obs:data.obs,upd});
  lset("cat_"+loc,cat);if(day===today())lset("day_"+loc+"_"+day,data);st("Guardado ✓ "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));if(role==="admin")badges()}
 catch(x){st("No se pudo guardar: "+(x.code||x),1)}};

/* ===== Resumen / calendario (admin) ===== */
const pad=x=>String(x).padStart(2,"0"),fd=d=>d.split("-").reverse().join("/");
let cm=null,MON={},CAT={};
const hasMov=d=>Object.values((d&&d.mov)||{}).some(m=>Object.values(m).some(v=>v!==""&&v!=null));
async function showSummary(){$("edv").hidden=true;$("sumv").hidden=false;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.l==="_sum"));
 if(!cm){const p=day.split("-");cm=[+p[0],+p[1]]}
 st("Resumen de todos los locales");$("dayv").innerHTML="<p>Cargando…</p>";await loadDay();drawCal();drawDay();monthP=loadMonth().then(drawCal)}
let monthP=Promise.resolve();
async function loadDay(){await Promise.all(Object.keys(LOCS).map(async k=>{try{CAT[k]=await getCat(k)}catch(x){}
 try{const s=await getDoc(doc(db,"locs",k,"days",day));MON[k]=MON[k]||{};if(s.exists())MON[k][day]=s.data();else delete MON[k][day]}catch(x){}}))}
async function loadMonth(){const[y,m]=cm,a=`${y}-${pad(m)}-01`,b=`${y}-${pad(m)}-31`,R={};
 await Promise.all(Object.keys(LOCS).map(async k=>{R[k]={};try{const s=await getDocs(query(collection(db,"locs",k,"days"),where(documentId(),">=",a),where(documentId(),"<=",b)));s.docs.forEach(d=>R[k][d.id]=d.data())}catch(x){}}));MON=R}
async function shiftM(k){let[y,m]=cm;m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}cm=[y,m];await loadMonth();drawCal()}
function drawCal(){const[y,m]=cm,first=new Date(Date.UTC(y,m-1,1)),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),off=(first.getUTCDay()+6)%7,t=today(),K=Object.keys(LOCS);
 let h=`<div class="ch"><button data-m="-1">‹</button><b>${first.toLocaleDateString("es",{month:"long",year:"numeric",timeZone:"UTC"})}</b><button data-m="1">›</button></div><div class="cg">`+["L","M","X","J","V","S","D"].map(x=>`<i>${x}</i>`).join("");
 for(let i=0;i<off;i++)h+="<span></span>";
 for(let d=1;d<=dim;d++){const id=`${y}-${pad(m)}-${pad(d)}`,c=K.filter(k=>hasMov((MON[k]||{})[id])).length;
  h+=`<button data-d="${id}" class="${id===day?"sel ":""}${id===t?"td ":""}${c?"has":""}" ${id>t?"disabled":""}>${d}<small>${c?c+"/"+K.length:""}</small></button>`}
 $("cal").innerHTML=h+"</div>"}
$("cal").onclick=async e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.m)shiftM(+b.dataset.m);else if(b.dataset.d){day=b.dataset.d;await monthP;drawCal();drawDay()}};
$("all").onchange=()=>drawDay();$("rs").onclick=()=>{for(const k in CATC)delete CATC[k];showSummary()};
$("dayv").onclick=e=>{const b=e.target.closest("[data-ed]");if(b)open(b.dataset.ed,day)};
function drawDay(){const all=$("all").checked;let h=`<h3>${fd(day)}</h3>`;
 for(const[k,name]of Object.entries(LOCS)){const d=(MON[k]||{})[day],c=CAT[k];
  const when=d&&d.upd?`<span class="ok">guardado ${new Date(d.upd).toLocaleString("es",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>`:`<span>sin guardar</span>`;
  h+=`<details class="lc" ${d&&d.upd?"open":""}><summary><b>${esc(name)}</b>${when}</summary>`;
  if(!c)h+="<p>Este local aún no tiene catálogo.</p>";
  else if(!d)h+="<p>Sin datos este día.</p>";
  else{const F=c.fields;let rows="";
   c.items.forEach(it=>{const m=(d.mov||{})[it.id]||{},i0=n((d.inicio||{})[it.id]);
    if(!all&&!F.some(f=>m[f]!==""&&m[f]!=null&&m[f]!==0))return;
    const f=i0+n(m.e)-n(m.t)-n(m.m)-n(m.s)-n(m.d);
    rows+=`<tr><td class="nm">${esc(it.n)}</td><td>${fmt(i0)}</td>`+F.map(x=>`<td>${m[x]===""||m[x]==null?"":fmt(n(m[x]))}</td>`).join("")+`<td class="fin${f<0?" neg":""}">${fmt(f)}</td></tr>`});
   h+=rows?`<div class="tw"><table><tr><th>PRODUCTO</th><th>INICIO</th>${F.map(x=>`<th>${L[x]}</th>`).join("")}<th>FINAL</th></tr>${rows}</table></div>`:"<p>Sin movimientos registrados.</p>";
   if(d.obs)h+=`<p><b>Observación:</b> ${esc(d.obs)}</p>`}
  h+=`<p><button class="p" data-ed="${k}">Editar / agregar o quitar productos</button></p></details>`}
 $("dayv").innerHTML=h}
const _s=ses();if(_s&&USERS[_s])enter(_s);
</script></body></html>
